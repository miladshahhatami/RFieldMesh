name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not upload confidential Abaqus models or credentials.
  - type: input
    id: version
    attributes:
      label: RFieldMesh version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description and reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Operating system and Python environment
    validations:
      required: true
